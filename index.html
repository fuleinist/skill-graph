<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Graph - Visual Dependency Graph for AI Agent Skills</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f0f23;
      color: #e2e8f0;
      overflow: hidden;
    }
    
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    
    #graph {
      width: 100%;
      height: 100%;
    }
    
    .node {
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .node:hover {
      transform: scale(1.1);
    }
    
    .node circle {
      stroke: #fff;
      stroke-width: 2px;
      transition: all 0.3s;
    }
    
    .node text {
      font-size: 12px;
      fill: #e2e8f0;
      pointer-events: none;
    }
    
    .link {
      stroke-opacity: 0.6;
    }
    
    .link.dependency {
      stroke: #4ade80;
      stroke-dasharray: none;
    }
    
    .link.conflict {
      stroke: #f87171;
      stroke-dasharray: 5,5;
    }
    
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    
    #controls button, #controls input, #controls select {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    #controls button:hover {
      background: #334155;
    }
    
    #controls input {
      padding: 8px 12px;
    }
    
    #controls select {
      padding: 8px 12px;
    }
    
    #tooltip {
      position: absolute;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1000;
      max-width: 300px;
    }
    
    #tooltip.visible {
      opacity: 1;
    }
    
    #tooltip h3 {
      margin-bottom: 8px;
      color: #4ade80;
    }
    
    #tooltip .version {
      color: #4ade80;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    #tooltip .label {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    #tooltip .description {
      font-size: 13px;
      margin-bottom: 8px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    
    #tooltip .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    #tooltip .tag {
      padding: 2px 8px;
      background: #334155;
      border-radius: 4px;
      font-size: 11px;
    }
    
    #tooltip .deps {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 100;
    }
    
    #legend h4 {
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    #legend .item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    
    #legend .line {
      width: 30px;
      height: 2px;
    }
    
    #legend .line.dashed {
      background: repeating-linear-gradient(
        to right,
        #f87171 0, #f87171 5px,
        transparent 5px, transparent 10px
      );
    }
    
    #stats {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 100;
    }
    
    #stats h4 {
      margin-bottom: 8px;
      color: #94a3b8;
    }
    
    #stats .stat {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 4px;
    }
    
    #stats .stat span:last-child {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div id="graph-container">
    <svg id="graph"></svg>
    
    <div id="controls">
      <input type="text" id="search" placeholder="Search skills...">
      <select id="filter-tag">
        <option value="">All tags</option>
      </select>
      <button id="reset">Reset View</button>
      <button id="export">Export PNG</button>
    </div>
    
    <div id="stats">
      <h4>Graph Stats</h4>
      <div class="stat"><span>Nodes</span><span id="node-count">0</span></div>
      <div class="stat"><span>Dependencies</span><span id="dep-count">0</span></div>
      <div class="stat"><span>Conflicts</span><span id="conflict-count">0</span></div>
    </div>
    
    <div id="legend">
      <h4>Legend</h4>
      <div class="item"><div class="line" style="background: #4ade80;"></div>Dependency</div>
      <div class="item"><div class="line dashed"></div>Conflict</div>
    </div>
    
    <div id="tooltip">
      <h3 id="tooltip-name"></h3>
      <div><span class="label">Version:</span> <span id="tooltip-version" class="version"></span></div>
      <div><span class="label">Description:</span> <span id="tooltip-desc" class="description"></span></div>
      <div class="tags" id="tooltip-tags"></div>
      <div class="deps" id="tooltip-deps"></div>
    </div>
  </div>
  
  <script>
    let nodes = [];
    let links = [];
    let simulation;
    let svg, g, zoom;
    let manifest = { skills: [] };
    
    const tagColors = {
      'tools': '#4ade80',
      'visualization': '#f472b6',
      'registry': '#fbbf24',
      'monitoring': '#22d3ee',
      'api': '#a78bfa',
      'cli': '#f97316',
      'scraping': '#ef4444',
      'debugging': '#6366f1',
      'merge': '#14b8a6',
      'utilities': '#84cc16',
      'backend': '#ec4899'
    };
    
    async function loadManifest() {
      try {
        const response = await fetch('/api/manifest');
        manifest = await response.json();
      } catch (err) {
        console.error('Failed to load manifest:', err);
        manifest = getSampleManifest();
      }
      initGraph();
      updateTags();
    }
    
    function getSampleManifest() {
      return {
        skills: [
          { name: 'skill-graph', version: '1.0.0', description: 'Visual dependency graph for AI agent skills', tags: ['visualization', 'tools'], dependencies: { d3: '^7.0.0' }, conflicts: {} },
          { name: 'agent-skills-registry', version: '1.0.0', description: 'GitHub registry for AI agent skills', tags: ['registry', 'tools'], dependencies: {}, conflicts: {} },
          { name: 'context-budget', version: '1.0.0', description: 'Token budgeting for AI agents', tags: ['monitoring', 'tools'], dependencies: {}, conflicts: {} },
          { name: 'local-rag-bridge', version: '1.0.0', description: 'API layer for local LLMs', tags: ['api', 'backend'], dependencies: { fastapi: '^0.100.0' }, conflicts: {} },
          { name: 'prompt-lens', version: '1.0.0', description: 'CLI tool for prompt optimization', tags: ['cli', 'tools'], dependencies: {}, conflicts: {} },
          { name: 'stealth-fetch', version: '1.0.0', description: 'Anti-detection HTTP library', tags: ['scraping', 'utilities'], dependencies: {}, conflicts: { 'context-budget': '^1.0.0' } },
          { name: 'skill-merge', version: '1.0.0', description: 'Merge tool for agent skill sets', tags: ['merge', 'tools'], dependencies: {}, conflicts: {} },
          { name: 'agent-diff', version: '1.0.0', description: 'Diff tool for agent context snapshots', tags: ['debugging', 'tools'], dependencies: {}, conflicts: {} }
        ]
      };
    }
    
    function initGraph() {
      const container = document.getElementById('graph-container');
      const width = container.clientWidth;
      const height = container.clientHeight;
      
      svg = d3.select('#graph')
        .attr('width', width)
        .attr('height', height);
      
      svg.selectAll('*').remove();
      
      g = svg.append('g');
      
      // Setup zoom
      zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });
      
      svg.call(zoom);
      
      // Build nodes and links
      nodes = manifest.skills.map(skill => ({
        id: skill.name,
        name: skill.name,
        version: skill.version,
        description: skill.description,
        tags: skill.tags || [],
        dependencies: skill.dependencies || {},
        conflicts: skill.conflicts || {}
      }));
      
      links = [];
      nodes.forEach(node => {
        Object.entries(node.dependencies).forEach(([dep, ver]) => {
          if (nodes.find(n => n.id === dep)) {
            links.push({ source: node.id, target: dep, type: 'dependency', version: ver });
          }
        });
        Object.entries(node.conflicts).forEach(([dep, ver]) => {
          if (nodes.find(n => n.id === dep)) {
            links.push({ source: node.id, target: dep, type: 'conflict', version: ver });
          }
        });
      });
      
      // Update stats
      document.getElementById('node-count').textContent = nodes.length;
      document.getElementById('dep-count').textContent = links.filter(l => l.type === 'dependency').length;
      document.getElementById('conflict-count').textContent = links.filter(l => l.type === 'conflict').length;
      
      // Create simulation
      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(150))
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(60));
      
      // Draw links
      const link = g.append('g')
        .attr('class', 'links')
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('class', d => `link ${d.type}`)
        .attr('stroke', d => d.type === 'dependency' ? '#4ade80' : '#f87171')
        .attr('stroke-width', 2);
      
      // Draw nodes
      const node = g.append('g')
        .attr('class', 'nodes')
        .selectAll('g')
        .data(nodes)
        .join('g')
        .attr('class', 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));
      
      node.append('circle')
        .attr('r', d => 30 + (d.tags?.length || 0) * 5)
        .attr('fill', d => getNodeColor(d));
      
      node.append('text')
        .attr('dy', 50)
        .attr('text-anchor', 'middle')
        .text(d => d.name);
      
      // Click handler
      node.on('click', (event, d) => showTooltip(event, d));
      
      // Update positions
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        
        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });
      
      function getNodeColor(d) {
        const primaryTag = d.tags?.[0] || 'tools';
        return tagColors[primaryTag] || '#4ade80';
      }
      
      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }
      
      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }
      
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }
    }
    
    function showTooltip(event, d) {
      const tooltip = document.getElementById('tooltip');
      document.getElementById('tooltip-name').textContent = d.name;
      document.getElementById('tooltip-version').textContent = `v${d.version}`;
      document.getElementById('tooltip-desc').textContent = d.description || '';
      
      const tagsEl = document.getElementById('tooltip-tags');
      tagsEl.innerHTML = (d.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      
      const depsEl = document.getElementById('tooltip-deps');
      const deps = Object.entries(d.dependencies || {});
      const conflicts = Object.entries(d.conflicts || {});
      let depsText = '';
      if (deps.length) depsText += `<strong>Depends on:</strong> ${deps.map(([n, v]) => `${n}@${v}`).join(', ')}`;
      if (conflicts.length) depsText += `<br><strong>Conflicts with:</strong> ${conflicts.map(([n, v]) => `${n}@${v}`).join(', ')}`;
      depsEl.innerHTML = depsText;
      
      tooltip.style.left = `${event.pageX + 15}px`;
      tooltip.style.top = `${event.pageY + 15}px`;
      tooltip.classList.add('visible');
    }
    
    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }
    
    function updateTags() {
      const select = document.getElementById('filter-tag');
      const allTags = new Set();
      manifest.skills.forEach(s => (s.tags || []).forEach(t => allTags.add(t)));
      
      select.innerHTML = '<option value="">All tags</option>';
      allTags.forEach(tag => {
        select.innerHTML += `<option value="${tag}">${tag}</option>`;
      });
    }
    
    // Event listeners
    document.addEventListener('click', () => hideTooltip());
    
    document.getElementById('search').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      d3.selectAll('.node').style('opacity', d => {
        if (!query) return 1;
        return d.name.toLowerCase().includes(query) || 
               d.description?.toLowerCase().includes(query) ? 1 : 0.2;
      });
      d3.selectAll('.link').style('opacity', d => {
        if (!query) return 0.6;
        return d.source.name.toLowerCase().includes(query) || 
               d.target.name.toLowerCase().includes(query) ? 0.6 : 0.1;
      });
    });
    
    document.getElementById('filter-tag').addEventListener('change', (e) => {
      const tag = e.target.value;
      d3.selectAll('.node').style('opacity', d => {
        if (!tag) return 1;
        return d.tags?.includes(tag) ? 1 : 0.2;
      });
    });
    
    document.getElementById('reset').addEventListener('click', () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });
    
    document.getElementById('export').addEventListener('click', () => {
      const svgElement = document.getElementById('graph');
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgElement);
      const blob = new Blob([svgString], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'skill-graph.svg';
      a.click();
      URL.revokeObjectURL(url);
    });
    
    loadManifest();
  </script>
</body>
</html>
